name: geneapp
description: A Flutter chat app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.2
  flutter_blue_plus: ^1.35.5
  flutter_markdown: ^0.7.7+1
  speech_to_text: ^7.1.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  android: true
  image_path: icon.jpeg
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - icon.jpeg
    - assets/mock/local_payload.json
